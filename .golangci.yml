version: "2"
linters:
  default: all
  disable:
  - noinlineerr
  - funcorder
  - godoclint
  - err113
  - cyclop
  - depguard
  - exhaustruct
  - exhaustruct_v5
  - funlen
  - gochecknoglobals
  - gocognit
  - ireturn
  - mnd
  - musttag
  - nestif
  - testpackage
  - varnamelen
  - wrapcheck
  - goconst
  settings:
    lll:
      line-length: 180
    staticcheck:
      # SA4023 panics on cmd/cli/clusters with honnef.co/go/tools v0.8.2 and go1.27 (nilness fact index out of range),
      # which aborts the whole golangci-lint run; keep the defaults and drop only that check until the upstream fix is released
      checks:
      - all
      - -ST1000
      - -ST1003
      - -ST1016
      - -ST1020
      - -ST1021
      - -ST1022
      - -SA4023
  exclusions:
    generated: lax
    presets:
    - comments
    - common-false-positives
    - legacy
    - std-error-handling
    paths:
    - third_party$
    - builtin$
    - examples$
    - front/node_modules
issues:
  fix: true
formatters:
  enable:
  - gci
  - gofmt
  - gofumpt
  - goimports
  exclusions:
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples$
    - front/node_modules
